name: whim-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:-whim-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-prod.yml
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-whim}
      MYSQL_USER: ${MYSQL_USER:-whim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在后端 .env 中填写 MYSQL_PASSWORD}
      MYSQL_SSL_MODE: ${MYSQL_SSL_MODE:-REQUIRED}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在后端 .env 中填写 REDIS_PASSWORD}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请在后端 .env 中填写 SA_TOKEN_JWT_SECRET}
      REQUEST_ENCRYPTION_PRIVATE_KEY: ${REQUEST_ENCRYPTION_PRIVATE_KEY:?请在后端 .env 中填写请求加密私钥}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true -Dfile.encoding=UTF-8}
    ports:
      # 同服务器的前端通过共享 Docker 网络访问，不需要对公网开放此端口。
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8089}:8089"
    volumes:
      - type: bind
        source: ${BACKEND_CONFIG_DIR:-./deploy/config}
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_FILES_DIR:-/opt/whim/backend/files}
        target: /app/data/files
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_LOGS_DIR:-/opt/whim/backend/logs}
        target: /app/logs
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--connect-timeout", "2", "--max-time", "5", "http://127.0.0.1:9090/actuator/health"]
      interval: 30s
      timeout: 8s
      start_period: 120s
      retries: 5
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    networks:
      database:
      frontend:
        aliases:
          - whim-api
    logging: *default-logging

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DB:-whim}
      MYSQL_USER: ${MYSQL_USER:-whim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在后端 .env 中填写 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在后端 .env 中填写 MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --require-secure-transport=ON
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-/opt/whim/backend/mysql}
        target: /var/lib/mysql
        bind:
          create_host_path: false
    healthcheck:
      # TCP 查询确认初始化已完成且业务账号可用，避免仅检查进程存活。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --ssl-mode=REQUIRED --connect-timeout=5 --silent --skip-column-names --execute='SELECT 1'"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 12
    networks:
      - database
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:8.4-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在后端 .env 中填写 REDIS_PASSWORD}
    # 再调用官方入口，确保完成数据目录授权并降权到 redis 用户。
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:-/opt/whim/backend/redis}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${REDIS_CONFIG_FILE:-./deploy/redis/redis.conf}
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks:
      - database
    logging: *default-logging

networks:
  database:
    internal: true
  frontend:
    external: true
    name: ${SHARED_NETWORK_NAME:-whim-network}
