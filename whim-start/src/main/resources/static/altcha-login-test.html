<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALTCHA 登录接口调试</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/altcha@3.2.2/dist/main/altcha.min.js"></script>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { max-width: 760px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
        h1 { font-size: 1.6rem; }
        section { margin: 24px 0; }
        button { padding: 9px 15px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.55; }
        pre, textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; }
        pre { overflow: auto; min-height: 52px; }
        textarea { min-height: 95px; resize: vertical; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .hint { color: #6b7280; }
        #status { min-height: 24px; }
        #status.error { color: #b91c1c; }
    </style>
</head>
<body>
<h1>ALTCHA 登录接口调试</h1>
<p>此页面与后端同源，先获取挑战，再完成验证。将生成的 <code>altcha</code> 值放入登录接口的 JSON 请求体。</p>

<section>
    <button id="load-challenge" type="button">获取新挑战</button>
    <p id="status" role="status" aria-live="polite">等待获取挑战。</p>
    <h2>挑战数据</h2>
    <pre id="challenge-output">尚未获取挑战</pre>
</section>

<section>
    <h2>完成验证</h2>
    <form id="captcha-form">
        <altcha-widget id="captcha-widget" language="zh-cn" auto="off"></altcha-widget>
    </form>
    <p class="hint">获取挑战后，点击上方组件完成计算。挑战有效期由服务端配置，过期后请重新获取。</p>
</section>

<section>
    <h2>ALTCHA 答案</h2>
    <textarea id="payload-output" readonly placeholder="验证完成后显示可提交的 altcha 字符串"></textarea>
    <div class="actions"><button id="copy-payload" type="button" disabled>复制 altcha</button></div>
</section>

<section>
    <h2>登录请求体示例</h2>
    <textarea id="login-output" readonly placeholder="验证完成后生成 JSON 请求体"></textarea>
    <div class="actions"><button id="copy-login" type="button" disabled>复制请求体</button></div>
    <p class="hint">请求地址：<code>POST /system/auth/login</code>，请求头：<code>Content-Type: application/json</code>。粘贴后替换用户名和密码。</p>
</section>

<script>
    const loadButton = document.getElementById('load-challenge');
    const statusOutput = document.getElementById('status');
    const challengeOutput = document.getElementById('challenge-output');
    const payloadOutput = document.getElementById('payload-output');
    const loginOutput = document.getElementById('login-output');
    const copyPayloadButton = document.getElementById('copy-payload');
    const copyLoginButton = document.getElementById('copy-login');
    const captchaWidget = document.getElementById('captcha-widget');
    const captchaForm = document.getElementById('captcha-form');

    /** 显示当前操作状态。 */
    function showStatus(message, isError = false) {
        statusOutput.textContent = message;
        statusOutput.classList.toggle('error', isError);
    }

    /** 清除上一次验证生成的答案。 */
    function clearSolution() {
        payloadOutput.value = '';
        loginOutput.value = '';
        copyPayloadButton.disabled = true;
        copyLoginButton.disabled = true;
    }

    /** 获取项目接口返回的挑战，并交给 ALTCHA 组件。 */
    async function loadChallenge() {
        loadButton.disabled = true;
        clearSolution();
        challengeOutput.textContent = '正在获取挑战…';
        showStatus('正在请求 /system/auth/captcha…');

        try {
            const response = await fetch('/system/auth/captcha', {
                cache: 'no-store',
                signal: AbortSignal.timeout(10000)
            });
            const result = await response.json();
            if (!response.ok || result.code < 200 || result.code >= 300
                    || !result.data?.parameters || !result.data?.signature) {
                throw new Error(result.message || `获取挑战失败（HTTP ${response.status}）`);
            }

            const challenge = result.data;
            challengeOutput.textContent = JSON.stringify(challenge, null, 2);
            const widgetReady = await Promise.race([
                customElements.whenDefined('altcha-widget').then(() => true),
                new Promise(resolve => setTimeout(() => resolve(false), 8000))
            ]);
            if (!widgetReady) {
                throw new Error('ALTCHA 组件加载超时，请检查 CDN 网络连接。');
            }

            captchaWidget.reset();
            captchaWidget.configure({ challenge });
            showStatus('挑战已获取，请点击 ALTCHA 组件完成验证。');
        } catch (error) {
            showStatus(error.message || '获取挑战失败。', true);
        } finally {
            loadButton.disabled = false;
        }
    }

    /** 将验证结果组装为登录接口需要的请求体。 */
    function showSolution(payload) {
        payloadOutput.value = payload;
        loginOutput.value = JSON.stringify({
            username: '请替换为用户名',
            password: '请替换为密码',
            altcha: payload,
            rememberMe: false
        }, null, 2);
        copyPayloadButton.disabled = false;
        copyLoginButton.disabled = false;
        showStatus('验证完成，可以复制 altcha 或登录请求体。');
    }

    /** 将指定文本复制到剪贴板。 */
    async function copyText(value) {
        try {
            await navigator.clipboard.writeText(value);
            showStatus('已复制到剪贴板。');
        } catch {
            showStatus('复制失败，请手动选择文本复制。', true);
        }
    }

    /** 阻止调试表单提交。 */
    captchaForm.addEventListener('submit', event => event.preventDefault());
    /** 点击按钮时请求新的挑战。 */
    loadButton.addEventListener('click', loadChallenge);
    /** 验证完成后读取组件生成的 Base64 答案。 */
    captchaWidget.addEventListener('verified', event => {
        const payload = event.detail?.payload || captchaForm.querySelector('input[name="altcha"]')?.value;
        if (payload) {
            showSolution(payload);
        } else {
            showStatus('组件已验证，但未找到 altcha 答案。', true);
        }
    });
    /** 挑战失效或计算失败时清除旧答案。 */
    captchaWidget.addEventListener('statechange', event => {
        if (event.detail?.state === 'expired' || event.detail?.state === 'error') {
            clearSolution();
            showStatus('挑战已过期或验证失败，请获取新挑战。', true);
        }
    });
    /** 复制 ALTCHA 答案。 */
    copyPayloadButton.addEventListener('click', () => copyText(payloadOutput.value));
    /** 复制登录请求体。 */
    copyLoginButton.addEventListener('click', () => copyText(loginOutput.value));
</script>
</body>
</html>
