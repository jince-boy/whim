<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whim Login Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            color: #172033;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(960px, calc(100vw - 32px));
            margin: 32px auto;
            display: grid;
            gap: 18px;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
        }

        h1,
        h2 {
            margin: 0;
            line-height: 1.2;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
        }

        h2 {
            font-size: 17px;
            font-weight: 700;
        }

        form,
        section {
            display: grid;
            gap: 14px;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            background: #ffffff;
        }

        form,
        section {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #c6ceda;
            border-radius: 6px;
            padding: 10px 12px;
            color: #111827;
            font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif;
            background: #ffffff;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        textarea {
            min-height: 150px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            resize: vertical;
        }

        button {
            justify-self: start;
            border: 1px solid #175cd3;
            border-radius: 6px;
            padding: 10px 16px;
            color: #ffffff;
            background: #175cd3;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        button:disabled {
            border-color: #98a2b3;
            background: #98a2b3;
            cursor: not-allowed;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .captcha {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .captcha img {
            width: 160px;
            height: 60px;
            border: 1px solid #c6ceda;
            border-radius: 6px;
        }

        .state {
            min-height: 40px;
            border-radius: 6px;
            padding: 10px 12px;
            background: #eef4ff;
            color: #1849a9;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 720px) {
            header,
            .grid {
                grid-template-columns: 1fr;
                display: grid;
            }

            header {
                align-items: start;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Whim 登录 Demo</h1>
    </header>

    <form id="loginForm">
        <div class="grid">
            <label>
                登录接口
                <input id="loginUrl" value="/system/auth/login">
            </label>
            <label>
                验证码接口
                <input id="captchaUrl" value="/system/auth/captcha">
            </label>
            <label>
                用户名
                <input id="username" autocomplete="username" placeholder="用户名" minlength="5" maxlength="18" required>
            </label>
            <label>
                密码
                <input id="password" type="password" autocomplete="current-password" placeholder="密码" minlength="8" maxlength="18" required>
            </label>
            <label>
                GIF 验证码
                <input id="captchaCode" autocomplete="off" maxlength="4" pattern="[A-Za-z0-9]{4}" placeholder="请输入图片中的四位字符" required>
            </label>
        </div>
        <div class="captcha">
            <img id="captchaImage" alt="四位字母数字验证码">
            <button id="refreshCaptcha" type="button">换一张</button>
        </div>
        <label>
            <span class="checkbox">
                <input id="rememberMe" type="checkbox">
                记住我
            </span>
        </label>

        <div id="state" class="state" role="status" aria-live="polite">正在获取验证码</div>
        <button id="submitLogin" type="submit">登录</button>
    </form>

    <section>
        <h2>登录结果</h2>
        <div class="grid">
            <label>
                令牌类型
                <input id="tokenType" readonly>
            </label>
            <label>
                剩余有效期（秒）
                <input id="tokenExpiresIn" readonly>
            </label>
        </div>
        <label>
            访问令牌
            <textarea id="accessToken" readonly></textarea>
        </label>
        <label>
            原始响应
            <textarea id="loginResponse" readonly></textarea>
        </label>
    </section>
</main>

<script>
    const loginForm = document.querySelector('#loginForm');
    const loginUrl = document.querySelector('#loginUrl');
    const captchaUrl = document.querySelector('#captchaUrl');
    const username = document.querySelector('#username');
    const password = document.querySelector('#password');
    const rememberMe = document.querySelector('#rememberMe');
    const captchaCode = document.querySelector('#captchaCode');
    const captchaImage = document.querySelector('#captchaImage');
    const refreshCaptcha = document.querySelector('#refreshCaptcha');
    const state = document.querySelector('#state');
    const tokenType = document.querySelector('#tokenType');
    const tokenExpiresIn = document.querySelector('#tokenExpiresIn');
    const accessToken = document.querySelector('#accessToken');
    const loginResponse = document.querySelector('#loginResponse');
    const submitLogin = document.querySelector('#submitLogin');
    let uuid = '';

    /** 获取新的 GIF 验证码及其 UUID。 */
    async function loadCaptcha() {
        uuid = '';
        captchaImage.removeAttribute('src');
        captchaCode.value = '';
        submitLogin.disabled = true;
        const response = await fetch(captchaUrl.value.trim(), {
            headers: {Accept: 'application/json'},
            cache: 'no-store',
            signal: AbortSignal.timeout(10000)
        });
        const result = await response.json();
        if (!response.ok || result.code !== 200 || !result.data?.uuid || !result.data?.image) {
            throw new Error(result.message || '验证码获取失败');
        }
        captchaImage.src = result.data.image.startsWith('data:image/gif;base64,')
            ? result.data.image
            : `data:image/gif;base64,${result.data.image}`;
        uuid = result.data.uuid;
        submitLogin.disabled = false;
    }

    /** 向登录接口提交表单并展示认证令牌和原始响应。 */
    async function submitLoginRequest() {
        const response = await fetch(loginUrl.value.trim(), {
            method: 'POST',
            headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: username.value.trim(),
                password: password.value,
                uuid,
                captchaCode: captchaCode.value.trim(),
                rememberMe: rememberMe.checked
            }),
            signal: AbortSignal.timeout(10000)
        });
        const responseText = await response.text();
        let result;
        try {
            result = JSON.parse(responseText);
            loginResponse.value = JSON.stringify(result, null, 2);
        } catch {
            loginResponse.value = responseText;
            throw new Error(`登录接口返回了非 JSON 响应（HTTP ${response.status}）`);
        }
        if (!response.ok || result.code !== 200) {
            throw new Error(result.message || `登录失败（HTTP ${response.status}）`);
        }
        if (!result.data?.accessToken) {
            throw new Error('登录响应缺少 accessToken');
        }
        tokenType.value = result.data.tokenType ?? '';
        accessToken.value = result.data.accessToken;
        tokenExpiresIn.value = result.data.expiresIn ?? '';
    }

    /** 刷新验证码并显示获取结果。 */
    refreshCaptcha.addEventListener('click', async () => {
        refreshCaptcha.disabled = true;
        try {
            await loadCaptcha();
            state.textContent = '请填写图片中的四位字符';
        } catch (error) {
            state.textContent = error.message;
        } finally {
            refreshCaptcha.disabled = false;
        }
    });

    /** 阻止表单跳转并展示登录接口响应。 */
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!uuid) {
            state.textContent = '请先获取验证码';
            return;
        }
        submitLogin.disabled = true;
        state.textContent = '正在登录';
        loginResponse.value = '';
        tokenType.value = '';
        accessToken.value = '';
        tokenExpiresIn.value = '';
        try {
            await submitLoginRequest();
            state.textContent = '登录成功';
        } catch (error) {
            state.textContent = error.message;
        } finally {
            try {
                await loadCaptcha();
            } catch (error) {
                state.textContent += `；刷新验证码失败：${error.message}`;
            }
        }
    });

    loadCaptcha()
        .then(() => { state.textContent = '填写账号、密码和验证码后登录'; })
        .catch((error) => { state.textContent = error.message; });
</script>
</body>
</html>
