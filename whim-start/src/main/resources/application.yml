server:
  port: 8089

# 文件存储：本地目录不自动映射为公开静态资源
file:
  storage:
    enabled: true
    default-storage: local
    default-config-name: local
    max-file-size: 20MB
    local:
      - name: local
        base-path: ${FILE_STORAGE_PATH:./data/files}

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: whim
  # 开发环境
  profiles:
    active: @profiles_active@
  threads:
    virtual:
      # 是否启用虚拟线程，要求 JDK 21+
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  task:
    execution:
      # Spring Boot 默认应用任务执行器配置
      thread-name-prefix: whim-application-
      shutdown:
        await-termination: true
        await-termination-period: 10s
    scheduling:
      # Spring Boot 默认调度器配置
      thread-name-prefix: whim-scheduling-
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 使用 TLS 完成 caching_sha2_password 认证，避免首次连接或认证缓存失效后公钥获取失败。
    # 部署环境可通过 MYSQL_SSL_MODE=VERIFY_IDENTITY 启用服务器证书及主机名校验。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:whim}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 最大连接池数量
      maximum-pool-size: 20
      # 最小空闲线程数量
      minimum-idle: 10
      # 配置获取连接等待超时的时间
      connection-timeout: 30000
      # 校验超时时间
      validation-timeout: 5000
      # 空闲连接存活最大时间，默认10分钟
      idle-timeout: 600000
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      max-lifetime: 1800000
      # 多久检查一次连接的活性
      keepalive-time: 30000
  # Flyway 数据库版本迁移
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    fail-on-missing-locations: true
    out-of-order: false
  # Redis
  data:
    redis:
      # 使用 Redisson 访问 Redis，无需扫描 Spring Data Redis Repository 接口。
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      #      password: ${REDIS_PASSWD:}
      database: ${REDIS_DB:0}

# 全局线程池相关配置
thread-pool:
  # 是否启用计算任务执行器，设为 false 可直接关闭
  enabled: false
  # 通用异步线程名前缀
  thread-name-prefix: whim-async-task-
  # 通用异步线程池核心线程数
  core-pool-size: ${THREAD_POOL_CORE_POOL_SIZE:8}
  # 通用异步线程池最大线程数
  max-pool-size: ${THREAD_POOL_MAX_POOL_SIZE:16}
  # 通用异步线程池队列容量
  queue-capacity: 128
  # 非核心线程空闲存活时间，单位：秒
  keep-alive-seconds: 300
  # 是否允许核心线程超时回收
  allow-core-thread-timeout: false
  # 关闭线程池时是否等待任务执行完成
  wait-for-tasks-to-complete-on-shutdown: true
  # 关闭线程池时最长等待秒数
  await-termination-seconds: 10

# sa-token
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # jwt秘钥 （只有集成 sa-token-temp-jwt 模块时此参数才会生效）
  jwt-secret-key: 3i8ztwg38p2GvMrFgp48fv9CWAXCI5oBCDO2Pqcutdd
  # Token 有效期（单位：秒），默认30天，-1代表永不过期
  timeout: 604800 # 7天
  # Token 最低活跃频率（单位：秒）
  active-timeout: 86400 # 1天
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # 同一账号最大登录数量，-1代表不限 （只有在 isConcurrent=true，isShare=false 时此配置才有效）
  max-login-count: 3
  # 溢出 maxLoginCount 的客户端，将以何种方式注销下线 (LOGOUT=注销下线, KICKOUT=踢人下线, REPLACED=顶人下线)
  overflowLogoutMode: REPLACED
  # 尝试从 header 里读取 Token
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  # token前缀
  token-prefix: Bearer
  # 获取 Token-Session 时是否必须登录 （如果配置为true，会在每次获取 Token-Session 时校验是否登录）
  token-session-check-login: false
  # 是否输出操作日志
  is-log: false
  # 是否在初始化配置时打印版本字符画
  is-print: false
  # 拦截器放行路径（Ant 风格），不校验登录
  exclude-paths:
    - /
    - /system/auth/captcha
    - /system/auth/login
    - /error

# 请求加密：配置后正常启动即可，无需执行密钥生成脚本。
whim:
  request-encryption:
    # RSA 私钥（至少 3072 位）：PKCS#8 DER 的单行 Base64 字符串，不带头尾标记或换行，不可留空。
    # 前端 VITE_REQUEST_ENCRYPTION_PUBLIC_KEY 配置对应 SPKI DER 公钥的单行 Base64 字符串。
    # 直接在此填写私钥；生成新密钥：node scripts/generateRequestKey.mjs，并同步更新前端公钥。
    private-key: ""
    # JSON 请求体上限，密文按整个 encryptedData 包装体的字节数计算。
    max-body-bytes: 65536
    requests-per-minute: 120

# Mybatis plus
mybatis-plus:
  # 搜索指定包别名
  type-aliases-package: com.whim.**.mapper
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    # 自动驼峰命名规则（camel case）映射
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      id-type: ASSIGN_ID
      # 删除时写入本行主键，配合业务字段与 deleted 的联合唯一索引
      logicDeleteValue: id
      # 未删除统一使用非空的 0，确保联合唯一索引生效
      logicNotDeleteValue: 0

#p6spy sql日志监控
decorator:
  datasource:
    enabled: true
    p6spy:
      logging: slf4j
      log-format: "SQL耗时：%(executionTime)ms | 执行语句：%(sqlSingleLine)"
      enable-logging: true
