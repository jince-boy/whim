name: whim-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:-whim-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_REQUEST_ENCRYPTION_PUBLIC_KEY: ${VITE_REQUEST_ENCRYPTION_PUBLIC_KEY:?请在前端 .env 中填写请求加密公钥}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Whim Vue}
        VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-Whim 后台管理系统}
        VITE_APP_COPYRIGHT: ${VITE_APP_COPYRIGHT:-Copyright © 2025–Present Whim. All Rights Reserved.}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKEND_ADDRESS: ${BACKEND_ADDRESS:-whim-api:8089}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      NGINX_ENVSUBST_FILTER: ^(BACKEND_ADDRESS|VITE_API_BASE_URL)$$
    ports:
      # 默认由服务器上的 HTTPS 网关转发到此端口。
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ${NGINX_TEMPLATE_DIR:-./deploy/nginx/templates}
        target: /etc/nginx/templates
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    external: true
    name: ${SHARED_NETWORK_NAME:-whim-network}
