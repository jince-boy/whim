<div id="whim-online-sketch" lang="zh-CN" aria-label="系统监控在线用户页面草图">
  <aside class="wo-rail">
    <div class="wo-brand"><i data-lucide="layers-3" aria-hidden="true"></i> Whim</div>
    <div class="wo-nav"><i data-lucide="settings" aria-hidden="true"></i>系统管理</div>
    <div class="wo-nav"><i data-lucide="activity" aria-hidden="true"></i>系统监控</div>
    <div class="wo-selected" aria-current="page">在线用户</div>
  </aside>
  <div class="wo-main">
    <div class="wo-path">系统监控 <span>／</span> 在线用户</div>
    <div class="wo-body">
      <form class="wo-search" aria-label="筛选会话">
        <label>用户名<input name="username" placeholder="请输入用户名" maxlength="64" autocomplete="off"></label>
        <label>主机 IP<input name="ip" placeholder="请输入主机 IP" autocomplete="off"></label>
        <div class="wo-actions"><button class="wo-primary" type="submit">查询</button><button type="reset">重置</button></div>
      </form>
      <section class="wo-list" aria-label="在线会话">
        <div class="wo-tools">
          <div class="wo-summary"><h2>在线用户</h2><span class="wo-count" aria-live="polite"></span></div>
          <button type="button" data-refresh><i data-lucide="refresh-cw" aria-hidden="true"></i>刷新</button>
        </div>
        <div class="wo-scroll"><table aria-label="按最后活动时间倒序排列的在线会话">
          <thead><tr><th>用户名</th><th>客户端</th><th>设备类型</th><th>所属部门</th><th>主机 IP</th><th>登录地点</th><th>操作系统</th><th>浏览器</th><th>登录时间</th><th>最后活动时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table></div>
        <div class="wo-footer"><span class="wo-feedback" role="status"></span><div class="wo-pages">
          <button type="button" data-prev aria-label="上一页">‹</button><span class="wo-page"></span><button type="button" data-next aria-label="下一页">›</button>
        </div></div>
      </section>
    </div>
  </div>
  <dialog aria-labelledby="wo-confirm-title">
    <h2 id="wo-confirm-title">强制下线此会话？</h2>
    <p class="wo-target"></p><p>该终端需要重新登录。同一账号的其他会话仍可使用。</p>
    <div class="wo-dialog-actions"><button type="button" data-cancel>取消</button><button class="wo-danger" type="button" data-confirm>确认下线</button></div>
  </dialog>
</div>
<style>
  #whim-online-sketch {
    --wo-paper:light-dark(#fff,#202527); --wo-canvas:light-dark(#f5f7f8,#161a1c);
    --wo-ink:light-dark(#232c31,#e7edee); --wo-muted:light-dark(#58676e,#b0bec3);
    --wo-edge:light-dark(#dce3e5,#394347); --wo-green:light-dark(#117e57,#80dcb4);
    --wo-wash:light-dark(#e7f5ee,#203a30); --wo-risk:light-dark(#ac373e,#ffa4aa);
    display:grid;grid-template-columns:141px minmax(0,1fr);overflow:hidden;border:1px solid var(--wo-edge);
    border-radius:9px;background:var(--wo-canvas);color:var(--wo-ink);font:14px/1.5 "Inter","Microsoft YaHei UI",sans-serif;
  }
  #whim-online-sketch *{box-sizing:border-box}
  #whim-online-sketch .wo-rail{background:var(--wo-paper);border-right:1px solid var(--wo-edge);padding:0 9px}
  #whim-online-sketch .wo-brand{display:flex;align-items:center;gap:9px;height:57px;padding:0 10px;margin-bottom:12px;font-size:20px;font-weight:600}
  #whim-online-sketch .wo-brand svg{color:var(--wo-green);width:23px;height:23px}
  #whim-online-sketch .wo-nav,#whim-online-sketch .wo-selected{padding:9px 12px;display:flex;align-items:center;gap:9px}
  #whim-online-sketch .wo-selected{padding-left:37px;color:var(--wo-green);background:var(--wo-wash);border-radius:5px;font-weight:600}
  #whim-online-sketch svg{width:16px;height:16px}
  #whim-online-sketch .wo-main{min-width:0}
  #whim-online-sketch .wo-path{padding:14px 20px;border-bottom:1px solid var(--wo-edge);background:var(--wo-paper)}
  #whim-online-sketch .wo-path span{color:var(--wo-muted);margin:0 7px}
  #whim-online-sketch .wo-body{display:grid;grid-template-columns:minmax(0,1fr);gap:13px;padding:16px}
  #whim-online-sketch .wo-search,#whim-online-sketch .wo-list{border:1px solid var(--wo-edge);border-radius:7px;background:var(--wo-paper)}
  #whim-online-sketch .wo-search{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px}
  #whim-online-sketch label{display:grid;flex:1 1 125px;gap:5px;font-size:13px}
  #whim-online-sketch input,#whim-online-sketch button{border:1px solid var(--wo-edge);background:var(--wo-paper);color:var(--wo-ink);border-radius:5px;font:inherit;min-height:34px}
  #whim-online-sketch input{width:100%;padding:5px 10px}
  #whim-online-sketch button{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:4px 12px;cursor:pointer;white-space:nowrap}
  #whim-online-sketch button:disabled{opacity:.45;cursor:default}
  #whim-online-sketch .wo-primary{background:var(--wo-green);color:var(--wo-paper);border-color:var(--wo-green)}
  #whim-online-sketch .wo-actions,#whim-online-sketch .wo-pages,#whim-online-sketch .wo-dialog-actions{display:flex;align-items:center;gap:7px}
  #whim-online-sketch .wo-tools,#whim-online-sketch .wo-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px}
  #whim-online-sketch h2{margin:0;font-size:18px;font-weight:600}
  #whim-online-sketch .wo-count,#whim-online-sketch .wo-footer{color:var(--wo-muted);font-size:13px}
  #whim-online-sketch .wo-summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  #whim-online-sketch .wo-scroll{overflow-x:auto}
  #whim-online-sketch table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
  #whim-online-sketch th,#whim-online-sketch td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--wo-edge);vertical-align:middle}
  #whim-online-sketch th{background:var(--wo-canvas);font-weight:500;color:var(--wo-muted)}
  #whim-online-sketch th:first-child,#whim-online-sketch td:first-child{padding-left:16px}
  #whim-online-sketch th:last-child,#whim-online-sketch td:last-child{position:sticky;right:0;padding:7px 14px;background:var(--wo-paper);box-shadow:inset 1px 0 var(--wo-edge)}
  #whim-online-sketch th:last-child{background:var(--wo-canvas)}
  #whim-online-sketch td:nth-child(5),#whim-online-sketch time{font-variant-numeric:tabular-nums}
  #whim-online-sketch .wo-end{color:var(--wo-risk);border:0;background:transparent;padding:0}
  #whim-online-sketch .wo-current{color:var(--wo-green);background:var(--wo-wash);border-radius:4px;padding:3px 5px;font-size:12px}
  #whim-online-sketch .wo-pages button{padding:0;width:32px}
  #whim-online-sketch dialog{width:min(365px,90%);border:1px solid var(--wo-edge);border-radius:9px;padding:20px;color:var(--wo-ink);background:var(--wo-paper)}
  #whim-online-sketch dialog::backdrop{background:rgba(21,34,40,.35)}
  #whim-online-sketch dialog p{margin:8px 0 0}
  #whim-online-sketch .wo-dialog-actions{justify-content:flex-end;margin-top:18px}
  #whim-online-sketch .wo-danger{color:var(--wo-paper);background:var(--wo-risk);border-color:var(--wo-risk)}
  @media(max-width:1100px){#whim-online-sketch{grid-template-columns:minmax(0,1fr)}#whim-online-sketch .wo-rail{display:none}}
  @media(max-width:540px){#whim-online-sketch .wo-body{padding:8px}#whim-online-sketch .wo-search{padding:10px}#whim-online-sketch .wo-tools,#whim-online-sketch .wo-footer{padding:10px}}
  @media(pointer:coarse){#whim-online-sketch button,#whim-online-sketch input{min-height:44px}#whim-online-sketch input{font-size:16px}}
</style>
<script>
(() => {
  const root = document.getElementById('whim-online-sketch');
  const find = selector => root.querySelector(selector);
  const fields = find('form').elements;
  const dialog = find('dialog');
  const rows = [
    {id:1, user:'linche', name:'林澈', client:'Browser', device:'Desktop', dept:'技术部', browser:'Chrome', os:'Windows 11', ip:'192.0.2.18', city:'杭州', active:'14:36', login:'09:08', current:true},
    {id:2, user:'shenning', name:'沈宁', client:'Browser', device:'Desktop', dept:'运营部', browser:'Edge', os:'Windows 11', ip:'198.51.100.7', city:'上海', active:'14:32', login:'13:12'},
    {id:3, user:'linche', name:'林澈', client:'Browser', device:'Phone', dept:'技术部', browser:'Safari', os:'iOS', ip:'203.0.113.29', city:'杭州', active:'14:27', login:'12:46'},
    {id:4, user:'xumu', name:'许牧', client:'Browser', device:'Desktop', dept:'财务部', browser:'Chrome', os:'macOS', ip:'192.0.2.35', city:'宁波', active:'14:18', login:'10:15'},
    {id:5, user:'zhouhe', name:'周禾', client:'Browser', device:'Desktop', dept:'运营部', browser:'Firefox', os:'Windows 11', ip:'198.51.100.33', city:'南京', active:'13:58', login:'08:55'}
  ];
  const size = 4;
  let user = '', ip = '', page = 1, selected = null, ended = new Set();
  const save = () => window.openai?.setWidgetState?.({privateContent:{user,ip,page,ended:[...ended]}})?.catch(() => {});
  function render() {
    const list = rows.filter(row => !ended.has(row.id) && row.user.toLowerCase().includes(user) && row.ip.includes(ip));
    const pages = Math.max(1,Math.ceil(list.length / size));
    page = Math.max(1,Math.min(page,pages));
    find('.wo-count').textContent = new Set(list.map(row => row.user)).size + ' 个账号 · ' + list.length + ' 个有效会话';
    find('.wo-page').textContent = page + ' / ' + pages;
    find('[data-prev]').disabled = page === 1;
    find('[data-next]').disabled = page === pages;
    find('tbody').innerHTML = list.slice((page-1)*size,page*size).map(row =>
      '<tr>' + [row.user,row.client,row.device,row.dept,row.ip,row.city,row.os,row.browser].map(value => '<td>' + value + '</td>').join('') +
      '<td><time>11-23 ' + row.login + '</time></td><td><time>11-23 ' + row.active + '</time></td><td>' +
      (row.current ? '<span class="wo-current">当前会话</span>' : '<button type="button" class="wo-end" data-end="' + row.id + '">强制下线</button>') + '</td></tr>'
    ).join('') || '<tr><td colspan="11">未找到符合条件的在线会话</td></tr>';
  }
  function restore(state) {
    const value = state?.privateContent || {};
    user = typeof value.user === 'string' ? value.user : '';
    ip = typeof value.ip === 'string' ? value.ip : '';
    ended = new Set(Array.isArray(value.ended) ? value.ended.filter(id => rows.some(row => row.id === id && !row.current)) : []);
    page = Number.isInteger(value.page) ? value.page : 1;
    fields.username.value = user;
    fields.ip.value = ip;
    render();
  }
  find('form').onsubmit = event => {
    event.preventDefault(); user = fields.username.value.trim().toLowerCase(); ip = fields.ip.value.trim(); page = 1;
    find('.wo-feedback').textContent = ''; render(); save();
  };
  find('form').onreset = () => { user = ''; ip = ''; page = 1; find('.wo-feedback').textContent = ''; render(); save(); };
  find('[data-prev]').onclick = () => { page--; render(); save(); };
  find('[data-next]').onclick = () => { page++; render(); save(); };
  find('[data-refresh]').onclick = () => { render(); find('.wo-feedback').textContent = '列表已刷新'; };
  find('tbody').onclick = event => {
    const button = event.target.closest('[data-end]');
    if (!button) return;
    selected = rows.find(row => row.id === Number(button.dataset.end) && !row.current);
    if (!selected) return;
    find('.wo-target').textContent = selected.name + '（' + selected.user + '） · ' + selected.browser + ' / ' + selected.os + ' · ' + selected.ip;
    dialog.showModal();
  };
  find('[data-cancel]').onclick = () => dialog.close();
  find('[data-confirm]').onclick = () => {
    if (!selected) return;
    ended.add(selected.id); find('.wo-feedback').textContent = selected.name + '的 ' + selected.browser + ' 会话已下线';
    dialog.close(); render(); save();
  };
  dialog.onclose = () => { selected = null; };
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    if (state !== undefined) restore(state);
  });
})();
</script>
